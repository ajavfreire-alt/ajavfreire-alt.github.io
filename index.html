<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Amerigest – Gestão de Condomínios | Lisboa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Administração rigorosa e transparente de condomínios na Grande Lisboa.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #333;
    }

    header {
      background: #ffffff;
      padding: 20px;
      text-align: center;
      border-bottom: 4px solid #1f4e79;
    }

    header img {
      max-width: 220px;
    }

    .hero {
      background:
        linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
        url("fundo.jpg") center/cover no-repeat;
      color: white;
      padding: 100px 20px;
      text-align: center;
    }

    h1, h2 {
      color: #1f4e79;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-top: 40px;
    }

    .service-card {
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .service-card i {
      font-size: 32px;
      color: #1f4e79;
      margin-bottom: 15px;
    }

    form input,
    form textarea {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    form button {
      background: #1f4e79;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Amerigest</h1>
  <p>Gestão de Condomínios</p>
</header>

<section class="hero">
  <h1>Gestão Profissional de Condomínios</h1>
  <p>Administração rigorosa, transparente e próxima dos condóminos.</p>
</section>

<section>
  <h2>Serviços</h2>

  <div class="services-grid">
    <div class="service-card">
      <i class="fa-solid fa-building"></i>
      <h3>Gestão Administrativa</h3>
    </div>

    <div class="service-card">
      <i class="fa-solid fa-euro-sign"></i>
      <h3>Gestão Financeira</h3>
    </div>

    <div class="service-card">
      <i class="fa-solid fa-screwdriver-wrench"></i>
      <h3>Manutenção</h3>
    </div>
  </div>
</section>

</body>
</html>
